[package]
name = "football-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
obscura = ["dep:async-tungstenite", "dep:tokio", "dep:futures", "dep:thiserror"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
football-domain = { path = "../domain" }
football-identity = { path = "../identity" }
football-storage = { path = "../storage" }
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
uuid.workspace = true
tokio = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
thiserror = { workspace = true, optional = true }
tracing.workspace = true
async-tungstenite = { version = "0.32", features = ["tokio-runtime"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
wiremock.workspace = true